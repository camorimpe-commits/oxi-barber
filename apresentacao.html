<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>1/2 · Apresentação · Oxi-Sanitização para Barbearias</title>
    <meta
      name="description"
      content="Apresentação executiva em duas telas para fechar assinatura mensal de oxi-sanitização em barbearias."
    />
    <meta name="theme-color" content="#161c26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Bebas+Neue&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="deck-body">
    <div id="deck-stage" class="deck-stage">
      <div id="slide-root" style="width:100%;height:100%;"></div>
    </div>

    <nav class="deck-controls" aria-label="Controles da apresentação">
      <button id="btn-prev" type="button" aria-label="Tela anterior">← Anterior</button>
      <span id="slide-counter" style="padding:0 10px;font-weight:700;">1 / 2</span>
      <button id="btn-next" type="button" aria-label="Próxima tela">Próxima →</button>
      <button id="btn-fs" type="button">Tela cheia (F)</button>
      <a href="./apresentacao-oxi-barbearias.pdf" download="apresentacao-oxi-barbearias.pdf">Baixar PDF</a>
      <a href="./index.html">Sair</a>
    </nav>

    <script src="./oxi.js"></script>
    <script>
      const { PLANOS, brl, brlCentavos, calcularROI, montarTextoProposta, escapeHtml } = window.OXI_BARBER;

      const params = new URLSearchParams(window.location.search);
      const state = {
        tela: params.get("tela") === "2" ? 2 : 1,
        barbearia: params.get("barbearia") || "sua barbearia",
        clientesDia: Number(params.get("clientes")) || 25,
        ticket: Number(params.get("ticket")) || 50,
        diasMes: Number(params.get("dias")) || 26,
        cadeiras: Number(params.get("cadeiras")) || 3,
        planoId: params.get("plano") || "mensal",
      };

      const stage = document.getElementById("deck-stage");
      const slideRoot = document.getElementById("slide-root");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");
      const btnFs = document.getElementById("btn-fs");
      const counter = document.getElementById("slide-counter");

      function fitStage() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = `scale(${scale})`;
      }

      function renderTela1() {
        return `
          <section class="oxi-glow oxi-slide-enter" style="display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:96px 110px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <p style="margin:0;font-size:24px;font-weight:700;letter-spacing:0.28em;text-transform:uppercase;color:var(--oxi-gold);">
                Diagnóstico para ${escapeHtml(state.barbearia)}
              </p>
              <span style="font-size:22px;padding:10px 22px;border-radius:999px;border:1px solid var(--oxi-line);background:var(--oxi-surface);color:var(--oxi-ozone);font-weight:700;">
                Tecnologia Ozônio · Plasma Frio
              </span>
            </div>

            <div style="display:grid;grid-template-columns:1.15fr 1fr;gap:84px;align-items:center;">
              <div>
                <h1 class="font-display" style="margin:0;font-size:146px;line-height:0.9;">
                  Cadeira limpa é cliente que volta.
                </h1>
                <p style="margin:28px 0 0;font-size:32px;color:var(--oxi-muted);max-width:780px;line-height:1.4;">
                  Álcool e aromatizante só limpam por cima. O <strong style="color:var(--oxi-ink);">ozônio (O₃)</strong> sanitiza o ar, os estofados e o ar-condicionado inteiro — sem químicos e sem parar o salão.
                </p>
              </div>

              <ul style="list-style:none;margin:0;padding:0;display:grid;gap:30px;font-size:31px;line-height:1.3;">
                <li style="border-left:5px solid var(--oxi-danger);padding-left:24px;">
                  <strong style="display:block;font-size:34px;">1. Fim do risco invisível</strong>
                  <span style="color:var(--oxi-muted);">Redução de até 99,99% de fungos, bactérias (foliculite/micose) e vírus em cadeiras, capas e dutos de ar.</span>
                </li>
                <li style="border-left:5px solid var(--oxi-ozone);padding-left:24px;">
                  <strong style="display:block;font-size:34px;">2. Zero odor impregnado</strong>
                  <span style="color:var(--oxi-muted);">Oxida cheiro de suor, umidade, pomada e cigarro na molécula. Após ventilar, o O₃ vira oxigênio puro.</span>
                </li>
                <li style="border-left:5px solid var(--oxi-gold);padding-left:24px;">
                  <strong style="display:block;font-size:34px;">3. Marketing que cobra mais</strong>
                  <span style="color:var(--oxi-muted);">Selo físico "Ambiente Oxi-Sanitizado" na vitrine + material semanal para o Instagram da barbearia.</span>
                </li>
              </ul>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--oxi-line);padding-top:24px;font-size:24px;color:var(--oxi-muted);">
              <span>Aplicação sempre com o salão fechado · 0 minutos de expediente perdido</span>
              <span style="color:var(--oxi-ozone);font-weight:700;">Próxima tela: Planos &amp; quanto custa por corte →</span>
            </div>
          </section>
        `;
      }

      function renderTela2() {
        const roi = calcularROI({
          clientesDia: state.clientesDia,
          ticket: state.ticket,
          diasMes: state.diasMes,
          cadeiras: state.cadeiras,
          planoId: state.planoId === "avulso" ? "mensal" : state.planoId,
        });
        const textoProposta = montarTextoProposta({
          ...state,
          planoId: roi.plano.id,
        });
        const waUrl = `https://wa.me/?text=${encodeURIComponent(textoProposta)}`;

        return `
          <section class="oxi-slide-enter" style="display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:84px 110px 104px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:40px;">
              <div>
                <p style="margin:0;font-size:24px;font-weight:700;letter-spacing:0.28em;text-transform:uppercase;color:var(--oxi-gold);">
                  Proposta de Assinatura · ${escapeHtml(state.barbearia)}
                </p>
                <h2 class="font-display" style="margin:8px 0 0;font-size:108px;line-height:0.95;">
                  Assinatura mensal. Agenda fixa.
                </h2>
              </div>
              <div style="text-align:right;">
                <p style="margin:0;font-size:22px;color:var(--oxi-muted);">Base da simulação</p>
                <p style="margin:4px 0 0;font-size:28px;font-weight:700;color:var(--oxi-ozone);">
                  ${state.clientesDia} clientes/dia · ticket ${brl.format(state.ticket)}
                </p>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin-top:42px;flex:1;">
              ${PLANOS.map((p) => {
                const isHighlight = p.id === "mensal";
                return `
                  <div style="position:relative;display:flex;flex-direction:column;justify-content:space-between;border-radius:32px;border:3px solid ${isHighlight ? "var(--oxi-ozone)" : "var(--oxi-line)"};background:${isHighlight ? "var(--oxi-surface)" : "transparent"};padding:42px;">
                    ${isHighlight ? `<span style="position:absolute;top:-20px;left:42px;border-radius:999px;background:var(--oxi-gold);color:var(--oxi-on-accent);padding:6px 20px;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;">Mais escolhido · 46% off</span>` : ""}
                    <div>
                      <h3 class="font-display" style="margin:0;font-size:62px;line-height:1;">${p.nome}</h3>
                      <p style="margin:10px 0 0;">
                        <span style="font-size:68px;font-weight:800;">${brl.format(p.preco)}</span>
                        <span style="font-size:28px;color:var(--oxi-muted);"> ${p.periodo}</span>
                      </p>
                      <p style="margin:8px 0 0;font-size:22px;color:${p.economiaMes > 0 ? "var(--oxi-success)" : "var(--oxi-muted)"};font-weight:700;">
                        ${p.economiaMes > 0 ? `Economia de ${brl.format(p.economiaMes)}/mês vs. avulso` : p.tagline}
                      </p>
                      <ul style="list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px;font-size:25px;line-height:1.3;">
                        ${p.itens.slice(0, 4).map((i) => `<li style="display:flex;gap:12px;"><span style="color:var(--oxi-ozone);font-weight:800;">✓</span><span>${i}</span></li>`).join("")}
                      </ul>
                    </div>
                    <p style="margin:24px 0 0;font-size:21px;color:var(--oxi-muted);">
                      ${p.id === "mensal" ? "Sem fidelidade · Cancele quando quiser" : p.id === "premium" ? "Ideal para alto fluxo (4+ cadeiras)" : "4 avulsos no mês sairiam R$ 720"}
                    </p>
                  </div>
                `;
              }).join("")}
            </div>

            <div style="margin-top:34px;border-radius:24px;border:1px solid var(--oxi-ozone);background:var(--oxi-surface);padding:26px 34px;display:flex;justify-content:space-between;align-items:center;gap:28px;">
              <p style="margin:0;font-size:30px;line-height:1.35;">
                <strong style="color:var(--oxi-ozone);">No plano ${roi.plano.nome}: ${brlCentavos.format(roi.porCliente)} por atendimento</strong>
                <span style="color:var(--oxi-muted);"> — o mês inteiro se paga com apenas </span>
                <strong style="color:var(--oxi-gold);">${roi.cortesParaPagar} corte${roi.cortesParaPagar > 1 ? "s" : ""}</strong>
                <span style="color:var(--oxi-muted);"> dos ${roi.atendMes} do mês.</span>
              </p>
              <a href="${waUrl}" target="_blank" rel="noopener noreferrer" style="white-space:nowrap;border-radius:999px;background:var(--oxi-gold);color:var(--oxi-on-accent);padding:16px 32px;font-size:26px;font-weight:800;">
                Fechar Plano Mensal →
              </a>
            </div>
          </section>
        `;
      }

      function go(tela) {
        state.tela = tela === 2 ? 2 : 1;
        const url = new URL(window.location.href);
        url.searchParams.set("tela", String(state.tela));
        window.history.replaceState({}, "", url);

        document.title = `${state.tela}/2 · Apresentação · Oxi-Sanitização para Barbearias`;
        counter.textContent = `${state.tela} / 2`;
        btnPrev.disabled = state.tela === 1;
        btnNext.disabled = state.tela === 2;
        slideRoot.innerHTML = state.tela === 1 ? renderTela1() : renderTela2();
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      }

      btnPrev.addEventListener("click", () => go(1));
      btnNext.addEventListener("click", () => go(2));
      btnFs.addEventListener("click", toggleFullscreen);

      window.addEventListener("resize", fitStage);
      window.addEventListener("keydown", (e) => {
        if (["ArrowRight", " ", "PageDown"].includes(e.key)) {
          e.preventDefault();
          go(2);
        } else if (["ArrowLeft", "PageUp"].includes(e.key)) {
          e.preventDefault();
          go(1);
        } else if (e.key.toLowerCase() === "f") {
          toggleFullscreen();
        }
      });

      let touchStartX = null;
      document.body.addEventListener("touchstart", (e) => {
        touchStartX = e.touches[0]?.clientX ?? null;
      });
      document.body.addEventListener("touchend", (e) => {
        const endX = e.changedTouches[0]?.clientX;
        if (touchStartX !== null && endX !== undefined && Math.abs(endX - touchStartX) > 50) {
          go(endX < touchStartX ? 2 : 1);
        }
        touchStartX = null;
      });

      fitStage();
      go(state.tela);
    </script>
  </body>
</html>
